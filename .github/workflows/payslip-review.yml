name: Verify private payslip import
on:
  push:
    branches: [codex/verify-compact-payslip]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test tests/e2e/payslip.test.js
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
