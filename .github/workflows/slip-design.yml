name: Проверка расчётного листка
on:
  push:
    branches: [codex/verify-slip-design]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --test --test-concurrency=1 tests/e2e/payslip*.test.js tests/e2e/v221.test.js
