name: Проверка карточки месяца и настроек аккаунта
on:
  push:
    branches: [codex/verify-month-2352]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --test --test-concurrency=1 tests/e2e/v2241.test.js tests/e2e/v2249-norm.test.js tests/e2e/app.test.js tests/e2e/v2193.test.js tests/e2e/v2212.test.js tests/e2e/v29.test.js
