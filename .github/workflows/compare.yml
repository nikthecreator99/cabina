name: CABINA PDF comparison
on:
  push:
    branches: [codex/verify-235-slip]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/e2e/compare-release.test.js
