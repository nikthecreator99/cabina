name: CABINA 2.35 browser checks
on:
  push:
    branches: [codex/verify-235-release]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [0,1,2,3,4,5,6,7]
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - shell: bash
        run: |
          suites=(tests/e2e/*.test.js)
          selected=()
          for ((i=${{ matrix.group }}; i<${#suites[@]}; i+=8)); do selected+=("${suites[i]}"); done
          node --test --test-concurrency=1 "${selected[@]}"
