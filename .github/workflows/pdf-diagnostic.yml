name: Diagnose mobile WebKit PDF
on:
  push:
    branches: [codex/diagnose-iphone-pdf]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit > /tmp/webkit-install.log
      - run: node .github/pdf-diagnostic.mjs
